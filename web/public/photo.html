<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d7377" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="icon" href="/logo-uchet1.svg" type="image/svg+xml" />
  <title>Фотограф · склад · Учёт №1</title>
  <!-- photo-ui rev=catalog-nav-20260802 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('uchet1_photo_theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #e8f0f0;
      --bg2: #d4e4e4;
      --card: #ffffff;
      --text: #0f1f1f;
      --muted: #5a6f6f;
      --line: #b8cece;
      --accent: #0d7377;
      --accent-soft: #c5e8e9;
      --ok: #1b8a5a;
      --ok-press: #147048;
      --bad: #c0392b;
      --warn: #c47a12;
      --shadow: 0 2px 10px rgba(13, 50, 50, .08);
      --tap: 64px;
    }
    [data-theme="dark"] {
      --bg: #0c1414;
      --bg2: #132020;
      --card: #1a2828;
      --text: #e8f4f4;
      --muted: #8aa0a0;
      --line: #2a4040;
      --accent: #2dd4bf;
      --accent-soft: #134e4a;
      --ok: #22a06b;
      --ok-press: #1b8a5a;
      --bad: #ef4444;
      --warn: #f59e0b;
      --shadow: 0 2px 14px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    /* Solid page bg on html+body — avoids gradient / height:100% band. */
    html {
      background: var(--bg);
      min-height: 100%;
    }
    body {
      margin: 0;
      font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    .chrome {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: calc(100dvh - 24px);
      background: transparent;
    }
    header.top {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      max-height: 64px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 1;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      display: block;
    }
    .brand-text {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
    }
    .brand h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--accent);
      white-space: nowrap;
    }
    .toolbar {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      margin-left: auto;
      flex-shrink: 0;
    }
    .toolbar .who {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header.top .btn-tool {
      min-height: 36px;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 10px;
    }
    #logout {
      margin-left: 2px;
      flex-shrink: 0;
    }
    .btn-tool {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      min-height: 48px;
      cursor: pointer;
      touch-action: manipulation;
    }
    #theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 4px 6px;
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      min-width: 0;
      min-height: 36px;
    }
    #theme-btn:hover { filter: brightness(0.97); }
    #theme-btn:active { filter: brightness(0.94); }
    #theme-btn .theme-lbl { display: none; }
    #theme-btn .theme-switch {
      position: relative;
      width: 40px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 999px;
      background: #9bb8b8;
      border: 2px solid transparent;
      transition: background .2s ease, border-color .2s ease;
    }
    #theme-btn .theme-switch::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
      transition: transform .2s ease;
    }
    #theme-btn[aria-pressed="true"] .theme-switch {
      background: var(--accent);
      border-color: var(--brand-dark, #134e4a);
    }
    #theme-btn[aria-pressed="true"] .theme-switch::after {
      transform: translateX(16px);
    }
    [data-theme="dark"] #theme-btn {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    [data-theme="dark"] #theme-btn .theme-switch {
      background: #2a4040;
    }
    [data-theme="dark"] #theme-btn[aria-pressed="true"] .theme-switch {
      background: var(--accent);
    }
    .btn-tool:active { background: var(--accent-soft); }
    .btn-tool.primary-tool {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    [data-theme="dark"] .btn-tool.primary-tool { color: #042f2e; }
    .progress {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .progress span {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--muted);
    }
    .progress b {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel h2 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
    .card-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-nav-mid {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-pos {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .nav-arrow {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 28px;
      line-height: 1;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .nav-arrow:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .nav-arrow:not(:disabled):active { background: var(--accent-soft); }
    .catalog-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .catalog-link:active { opacity: .75; }
    .name { font-size: 22px; font-weight: 700; line-height: 1.3; margin: 0; }
    .meta {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
      display: grid;
      gap: 4px;
    }
    .meta b { color: var(--text); font-weight: 600; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.95em; }
    .stock {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      width: fit-content;
    }
    .preview-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-height: min(52vh, 420px);
      border-radius: 16px;
      overflow: hidden;
      background: var(--bg2);
      border: 2px dashed var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .preview-wrap.has-img { border-style: solid; border-color: var(--accent); }
    .preview-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111;
    }
    .preview-hint {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }
    .btn-huge {
      min-height: var(--tap);
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .btn-upload { background: var(--accent); }
    .btn-upload:disabled, .btn-save:disabled, .btn-back:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .actions .btn-upload { grid-column: 1 / -1; }
    .btn-save { background: var(--ok); }
    .btn-save:active { background: var(--ok-press); }
    .btn-back {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .actions .btn-huge {
      min-height: 52px;
      font-size: 15px;
      padding: 8px 10px;
      line-height: 1.2;
    }
    .err {
      background: #fde8e8;
      color: var(--bad);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }
    [data-theme="dark"] .err { background: #3f1d1d; }
    .okmsg {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .filters {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-row { display: flex; gap: 8px; }
    .search-row input,
    .filters select {
      flex: 1;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 8px 12px;
      font-size: 16px;
      width: 100%;
    }
    .stock-wh {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }
    .stock-wh b { color: var(--text); font-weight: 600; }
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }
    .empty b { color: var(--ok); display: block; font-size: 22px; margin-bottom: 8px; }
    #file-input { display: none; }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
    }
    .nav-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .shift-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }
    .shift-bar .label { font-weight: 700; font-size: 15px; }
    .shift-bar .muted { color: var(--muted); font-size: 13px; }
    .shift-bar .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 12px;
      color: var(--muted);
      width: 100%;
    }
    .shift-bar .metrics b { color: var(--text); font-variant-numeric: tabular-nums; }
    dialog#shift-dlg {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      max-width: 360px;
      width: calc(100% - 24px);
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    dialog#shift-dlg::backdrop { background: rgba(15, 31, 31, .45); }
    .dlg-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    @media (max-width: 420px) {
      .name { font-size: 19px; }
      .btn-huge { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="chrome">
    <header class="top">
      <div class="brand">
        <img class="brand-logo" src="/logo-uchet1.svg" width="28" height="28" alt="Учёт №1" />
        <div class="brand-text">
          <h1>Фотограф · склад</h1>
        </div>
      </div>
      <div class="toolbar">
        <span class="who" id="who"></span>
        <button type="button" class="btn-tool" id="theme-btn" title="Тема: светлая / тёмная" aria-pressed="false" aria-label="Переключить тему">
          <span class="theme-switch" aria-hidden="true"></span>
          <span class="theme-lbl">Тёмная</span>
        </button>
        <button type="button" class="btn-tool primary-tool" id="reload">Обновить</button>
        <button type="button" class="btn-tool" id="logout">Выйти</button>
      </div>
    </header>

    <div class="nav-links">
      <a href="/pick">Задачи склада</a>
      <a href="/products">Каталог номенклатуры</a>
      <a href="/media/photos">Фото номенклатуры</a>
    </div>

    <div class="shift-bar" id="shift-bar" hidden>
      <span class="label">Смена</span>
      <span class="muted" id="shift-status">загрузка…</span>
      <button type="button" class="btn-tool primary-tool" id="shift-toggle" hidden>Начать смену</button>
      <div class="metrics" id="shift-metrics" hidden></div>
    </div>

    <div class="progress">
      <span>В очереди<b id="stat-left">—</b></span>
      <span>Сделано за сессию<b id="stat-done">0</b></span>
      <span>Всего без фото<b id="stat-total">—</b></span>
    </div>

    <div class="filters">
      <select id="category" aria-label="Категория">
        <option value="">Все категории</option>
      </select>
      <div class="search-row">
        <input type="search" id="q" placeholder="Артикул / код / название" enterkeyhint="search" />
        <button type="button" class="btn-tool" id="search-btn">Найти</button>
      </div>
    </div>

    <div id="err" class="err" hidden></div>
    <div id="ok" class="okmsg" hidden></div>

    <section class="panel" id="card">
      <p class="empty">Загрузка очереди…</p>
    </section>
  </div>

  <input type="file" id="file-input" accept="image/*" />

  <dialog id="shift-dlg">
    <form method="dialog" id="shift-form">
      <h3 style="margin:0 0 6px;font-size:20px" id="shift-dlg-title">Начать смену</h3>
      <p class="muted" id="shift-dlg-hint" style="margin:0;font-size:14px;line-height:1.45">
        Подтвердите начало смены фотографа на сегодня. Счётчики товаров и фото будут вестись до завершения смены.
      </p>
      <p class="err" id="shift-dlg-err" hidden style="margin:8px 0 0"></p>
      <div class="dlg-actions">
        <button type="button" class="btn-tool" id="shift-dlg-cancel">Отмена</button>
        <button type="submit" class="btn-tool primary-tool" id="shift-dlg-ok">Подтвердить</button>
      </div>
    </form>
  </dialog>

  <script>
    const THEME_KEY = 'uchet1_photo_theme';
    const CAT_KEY = 'uchet1_photo_category';
    let me = null;
    let queue = null;
    /** @type {any[]} */
    let items = [];
    let itemIndex = 0;
    let queueOffset = 0;
    let loadingMore = false;
    const PAGE_SIZE = 40;
    let current = null;
    let sessionDone = 0;
    let pendingFile = null;
    let pendingUrl = null;
    let uploading = false;
    let categoriesLoaded = false;
    let shiftState = null;
    let shiftDlgMode = 'start';
    /** @type {any[]} товары после «Сохранить» — для кнопки «Назад» */
    const historyStack = [];

    function applyTheme(theme) {
      const t = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
      const btn = document.getElementById('theme-btn');
      if (btn) {
        const dark = t === 'dark';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        btn.title = dark ? 'Тема: тёмная (нажмите для светлой)' : 'Тема: светлая (нажмите для тёмной)';
        btn.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
        const lbl = btn.querySelector('.theme-lbl');
        if (lbl) lbl.textContent = dark ? 'Светлая' : 'Тёмная';
      }
      const logo = document.querySelector('.brand-logo');
      if (logo) logo.src = t === 'dark' ? '/logo-uchet1-on-dark.svg' : '/logo-uchet1.svg';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#0c1414' : '#0d7377');
    }

    (function initTheme() {
      let t = 'light';
      try { t = localStorage.getItem(THEME_KEY) || 'light'; } catch (_) {}
      applyTheme(t);
    })();

    async function api(path, opts) {
      const res = await fetch('/api' + path, {
        credentials: 'same-origin',
        ...opts,
        headers: {
          ...(opts && opts.body && !(opts.body instanceof FormData)
            ? { 'Content-Type': 'application/json' }
            : {}),
          ...((opts && opts.headers) || {}),
        },
      });
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname || '/photo');
        throw new Error('login');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );
    }

    function showErr(msg) {
      const el = document.getElementById('err');
      el.hidden = !msg;
      el.textContent = msg || '';
    }

    function showOk(msg) {
      const el = document.getElementById('ok');
      el.hidden = !msg;
      el.textContent = msg || '';
      if (msg) setTimeout(() => { el.hidden = true; }, 2200);
    }

    function clearPending() {
      pendingFile = null;
      if (pendingUrl) {
        URL.revokeObjectURL(pendingUrl);
        pendingUrl = null;
      }
    }

    function updateStats() {
      const total = queue ? Number(queue.total) || 0 : 0;
      document.getElementById('stat-total').textContent = String(total);
      document.getElementById('stat-left').textContent = String(total);
      document.getElementById('stat-done').textContent = String(sessionDone);
    }

    function queueTotal() {
      return queue ? Number(queue.total) || 0 : 0;
    }

    function canGoPrev() {
      return itemIndex > 0;
    }

    function canGoNext() {
      return itemIndex + 1 < items.length || items.length < queueTotal();
    }

    function renderEmpty(opts) {
      const q = (opts && opts.q) || '';
      const cat = (opts && opts.cat) || '';
      const card = document.getElementById('card');
      let html;
      if (q) {
        html = `<div class="empty">Ничего не найдено по запросу.</div>`;
      } else if (cat) {
        html = `<div class="empty">Нет товаров в этой категории<br/><span style="font-size:14px">На складе без фото — 0. Смените категорию или выберите «Все категории».</span></div>`;
      } else {
        html = `<div class="empty"><b>Нет товаров в очереди</b>Все товары на складе уже с фото — или остатков нет.</div>`;
      }
      card.innerHTML = html;
      current = null;
      clearPending();
    }

    function renderItem(p) {
      current = p;
      clearPending();
      const card = document.getElementById('card');
      const sku = p.sku || '—';
      const code = p.code || '—';
      const qty = Number(p.stock_qty) || 0;
      const wh = String(p.stock_warehouses || p.warehouses || '').trim();
      const total = queueTotal() || items.length;
      const pos = items.length ? itemIndex + 1 : 0;
      const catalogHref = '/products/' + encodeURIComponent(p.id);
      card.innerHTML = `
        <div class="card-nav">
          <button type="button" class="nav-arrow" id="btn-prev" aria-label="Предыдущий товар" ${canGoPrev() ? '' : 'disabled'}>‹</button>
          <div class="card-nav-mid">
            <h2>Каталог без фото</h2>
            <span class="card-pos muted">${esc(pos)} / ${esc(total)}</span>
          </div>
          <button type="button" class="nav-arrow" id="btn-next" aria-label="Следующий товар" ${canGoNext() ? '' : 'disabled'}>›</button>
        </div>
        <p class="name">${esc(p.name || 'Без названия')}</p>
        <a class="catalog-link" id="catalog-link" href="${esc(catalogHref)}" target="_blank" rel="noopener">Смотреть в каталоге →</a>
        <div class="stock">Остаток · ${esc(qty)} шт</div>
        <div class="stock-wh">Склады: <b>${esc(wh || '—')}</b></div>
        <div class="meta">
          <div>Артикул: <b class="mono">${esc(sku)}</b></div>
          <div>Код 1С: <b class="mono">${esc(code)}</b></div>
          ${p.barcode ? `<div>Штрихкод: <b class="mono">${esc(p.barcode)}</b></div>` : ''}
          <div>Категория: <b>${esc(p.category || '—')}</b></div>
        </div>
        <div class="preview-wrap" id="preview" role="button" tabindex="0" title="Загрузить фото">
          <div class="preview-hint">Нажмите, чтобы загрузить<br/>фото из галереи или файла</div>
        </div>
        <div class="actions">
          <button type="button" class="btn-huge btn-back" id="btn-back" ${historyStack.length ? '' : 'disabled'}>Назад</button>
          <button type="button" class="btn-huge btn-save" id="btn-save" disabled>Сохранить</button>
          <button type="button" class="btn-huge btn-upload" id="btn-upload">Загрузить</button>
        </div>`;

      const openPicker = () => {
        if (uploading) return;
        document.getElementById('file-input').click();
      };
      document.getElementById('btn-upload').onclick = openPicker;
      document.getElementById('preview').onclick = openPicker;
      document.getElementById('preview').onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openPicker();
        }
      };
      document.getElementById('btn-save').onclick = () => savePhoto();
      document.getElementById('btn-back').onclick = () => goBack();
      document.getElementById('btn-prev').onclick = () => goPrev();
      document.getElementById('btn-next').onclick = () => goNext();
    }

    function setActionsBusy(busy) {
      ['btn-upload', 'btn-save', 'btn-back', 'btn-prev', 'btn-next'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === 'btn-save') {
          el.disabled = busy || !pendingFile;
        } else if (id === 'btn-back') {
          el.disabled = busy || !historyStack.length;
        } else if (id === 'btn-prev') {
          el.disabled = busy || !canGoPrev();
        } else if (id === 'btn-next') {
          el.disabled = busy || !canGoNext();
        } else {
          el.disabled = busy;
        }
      });
    }

    function showAt(index) {
      if (!items.length) return;
      itemIndex = Math.max(0, Math.min(items.length - 1, index));
      renderItem(items[itemIndex]);
    }

    function goPrev() {
      if (uploading || !canGoPrev()) return;
      showErr('');
      showAt(itemIndex - 1);
    }

    async function goNext() {
      if (uploading || loadingMore) return;
      showErr('');
      if (itemIndex + 1 < items.length) {
        showAt(itemIndex + 1);
        return;
      }
      if (items.length < queueTotal()) {
        const ok = await loadMore();
        if (ok && itemIndex + 1 < items.length) showAt(itemIndex + 1);
      }
    }

    function setPreview(file) {
      clearPending();
      pendingFile = file;
      pendingUrl = URL.createObjectURL(file);
      const wrap = document.getElementById('preview');
      if (!wrap) return;
      wrap.classList.add('has-img');
      wrap.innerHTML = `<img src="${pendingUrl}" alt="Превью" />`;
      const save = document.getElementById('btn-save');
      if (save) save.disabled = false;
    }

    function selectedCategory() {
      return (document.getElementById('category').value || '').trim();
    }

    async function loadCategories() {
      if (categoriesLoaded) return;
      let saved = '';
      try { saved = localStorage.getItem(CAT_KEY) || ''; } catch (_) {}
      try {
        const coverage = await api('/media/coverage');
        const cats = coverage.categories || [];
        const sel = document.getElementById('category');
        // Очередь /photo = остаток > 0 без фото. Счётчик without_photo (все без фото)
        // вводил в заблуждение: сотни в селекте, 0 в очереди.
        const withStock = cats.filter((c) => {
          const id = c.category_id == null ? '' : String(c.category_id);
          if (!id) return false;
          const stockLeft = Number(c.stock_without_photo);
          if (Number.isFinite(stockLeft)) return stockLeft > 0;
          return (Number(c.without_photo) || 0) > 0;
        });
        const noneStock = Number(
          (cats.find((c) => c.category_id == null) || {}).stock_without_photo
        ) || 0;
        const opts =
          '<option value="">Все категории</option>' +
          (noneStock > 0
            ? `<option value="__none__">Без категории · ${noneStock}</option>`
            : '') +
          withStock
            .map((c) => {
              const id = String(c.category_id);
              const left = Number.isFinite(Number(c.stock_without_photo))
                ? Number(c.stock_without_photo)
                : Number(c.without_photo) || 0;
              return `<option value="${esc(id)}">${esc(c.category_name)} · ${left}</option>`;
            })
            .join('');
        sel.innerHTML = opts;
        if (saved && [...sel.options].some((o) => o.value === saved)) {
          sel.value = saved;
        } else if (saved) {
          try { localStorage.removeItem(CAT_KEY); } catch (_) {}
          sel.value = '';
        }
        categoriesLoaded = true;
      } catch (_) {
        /* фильтр необязателен — очередь всё равно грузится */
      }
    }

    async function fetchQueuePage(offset) {
      const q = document.getElementById('q').value.trim();
      const cat = selectedCategory();
      const qs = new URLSearchParams({
        limit: String(PAGE_SIZE),
        offset: String(offset || 0),
      });
      if (q) qs.set('q', q);
      if (cat) qs.set('category_id', cat);
      return api('/media/photo-queue?' + qs.toString());
    }

    async function load() {
      showErr('');
      queueOffset = 0;
      itemIndex = 0;
      items = [];
      const q = document.getElementById('q').value.trim();
      const cat = selectedCategory();
      try {
        queue = await fetchQueuePage(0);
        items = queue.items || [];
        queueOffset = items.length;
        updateStats();
        if (!items.length) {
          renderEmpty({ q, cat });
          return;
        }
        showAt(0);
      } catch (e) {
        if (e.message !== 'login') showErr(e.message);
      }
    }

    async function loadMore() {
      if (loadingMore) return false;
      if (items.length >= queueTotal()) return false;
      loadingMore = true;
      setActionsBusy(true);
      try {
        const data = await fetchQueuePage(queueOffset);
        queue = data;
        const batch = data.items || [];
        const seen = new Set(items.map((p) => p.id));
        for (const p of batch) {
          if (p && p.id && !seen.has(p.id)) {
            items.push(p);
            seen.add(p.id);
          }
        }
        queueOffset += batch.length;
        updateStats();
        return batch.length > 0;
      } catch (e) {
        if (e.message !== 'login') showErr(e.message);
        return false;
      } finally {
        loadingMore = false;
        setActionsBusy(false);
      }
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return iso.slice(11, 16) || iso;
      }
    }

    function renderShift() {
      const status = document.getElementById('shift-status');
      const toggle = document.getElementById('shift-toggle');
      const metrics = document.getElementById('shift-metrics');
      const shift = shiftState && shiftState.shift;
      const day = (shiftState && shiftState.local && shiftState.local.day) || '';
      if (!shift) {
        status.textContent = day ? ('смена не начата · ' + day) : 'смена не начата';
        toggle.textContent = 'Начать смену';
        toggle.classList.add('primary-tool');
        metrics.hidden = true;
        metrics.innerHTML = '';
        return;
      }
      status.textContent =
        'идёт с ' + fmtTime(shift.started_at) + (shift.day ? ' · ' + shift.day : '');
      toggle.textContent = 'Завершить смену';
      toggle.classList.add('primary-tool');
      metrics.hidden = false;
      metrics.innerHTML =
        '<span>Товаров <b>' + esc(shift.products_done || 0) + '</b></span>' +
        '<span>Фото <b>' + esc(shift.photos_uploaded || 0) + '</b></span>' +
        '<span>Файлов <b>' + esc(shift.files_uploaded || 0) + '</b></span>';
    }

    async function refreshShift() {
      try {
        shiftState = await api('/media/photo/shift');
        const bar = document.getElementById('shift-bar');
        if (bar) bar.hidden = !!(shiftState && shiftState.shifts_disabled);
        if (shiftState && shiftState.shifts_disabled) return;
        renderShift();
      } catch (e) {
        if (e.message !== 'login') {
          const st = document.getElementById('shift-status');
          if (st) st.textContent = 'смена недоступна';
        }
      }
    }

    function openShiftDialog(mode) {
      shiftDlgMode = mode;
      const dlg = document.getElementById('shift-dlg');
      const title = document.getElementById('shift-dlg-title');
      const hint = document.getElementById('shift-dlg-hint');
      const ok = document.getElementById('shift-dlg-ok');
      const err = document.getElementById('shift-dlg-err');
      err.hidden = true;
      err.textContent = '';
      if (mode === 'end') {
        title.textContent = 'Завершить смену';
        hint.textContent =
          'Подтвердите завершение смены. Счётчики за сегодня сохранятся в отчёте.';
        ok.textContent = 'Завершить';
      } else {
        title.textContent = 'Начать смену';
        hint.textContent =
          'Подтвердите начало смены фотографа на сегодня. Счётчики товаров и фото будут вестись до завершения смены.';
        ok.textContent = 'Подтвердить';
      }
      if (typeof dlg.showModal === 'function') dlg.showModal();
      else dlg.setAttribute('open', '');
    }

    async function confirmShiftDialog() {
      const err = document.getElementById('shift-dlg-err');
      err.hidden = true;
      try {
        if (shiftDlgMode === 'end') {
          shiftState = await api('/media/photo/shift/end', {
            method: 'POST',
            body: '{}',
          });
          showOk('Смена завершена');
        } else {
          shiftState = await api('/media/photo/shift/start', {
            method: 'POST',
            body: '{}',
          });
          showOk('Смена начата');
        }
        renderShift();
        document.getElementById('shift-dlg').close();
      } catch (e) {
        if (e.message === 'login') return;
        err.hidden = false;
        err.textContent = e.message || 'Ошибка';
      }
    }

    async function savePhoto() {
      if (!current || !pendingFile || uploading) return;
      uploading = true;
      const save = document.getElementById('btn-save');
      if (save) save.textContent = 'Сохранение…';
      setActionsBusy(true);
      showErr('');
      const savedItem = current;
      try {
        const fd = new FormData();
        fd.append('file', pendingFile, pendingFile.name || 'photo.jpg');
        const res = await api('/media/products/' + encodeURIComponent(current.id) + '/photo', {
          method: 'POST',
          body: fd,
        });
        sessionDone += 1;
        historyStack.push(savedItem);
        if (res && res.shift) {
          if (!shiftState) shiftState = {};
          shiftState.shift = res.shift;
          renderShift();
        } else {
          await refreshShift();
        }
        showOk('Фото сохранено');
        await load();
      } catch (e) {
        if (e.message !== 'login') showErr(e.message);
        if (save) save.textContent = 'Сохранить';
        setActionsBusy(false);
      } finally {
        uploading = false;
      }
    }

    function goBack() {
      if (!historyStack.length || uploading) return;
      const prev = historyStack.pop();
      showErr('');
      renderItem(prev);
    }

    function onPickedFile(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (f) setPreview(f);
    }
    document.getElementById('file-input').onchange = onPickedFile;

    document.getElementById('theme-btn').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    };
    document.getElementById('reload').onclick = () => {
      historyStack.length = 0;
      load();
    };
    document.getElementById('search-btn').onclick = () => {
      historyStack.length = 0;
      load();
    };
    document.getElementById('q').onkeydown = (e) => {
      if (e.key === 'Enter') {
        historyStack.length = 0;
        load();
      }
    };
    document.getElementById('category').onchange = () => {
      try { localStorage.setItem(CAT_KEY, selectedCategory()); } catch (_) {}
      historyStack.length = 0;
      load();
    };

    document.addEventListener('keydown', (e) => {
      if (uploading || loadingMore) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goPrev();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        goNext();
      }
    });
    document.getElementById('logout').onclick = () => {
      const next = '/login?next=' + encodeURIComponent('/photo');
      const go = () => { location.replace(next); };
      api('/logout', { method: 'POST', body: '{}' }).catch(() => {}).finally(go);
      setTimeout(go, 800);
    };

    document.getElementById('shift-toggle').onclick = () => {
      openShiftDialog(shiftState && shiftState.shift ? 'end' : 'start');
    };
    document.getElementById('shift-dlg-cancel').onclick = () => {
      document.getElementById('shift-dlg').close();
    };
    document.getElementById('shift-form').onsubmit = (e) => {
      e.preventDefault();
      confirmShiftDialog();
    };

    (async function init() {
      try {
        me = await api('/me');
        const name = me.name || '';
        const login = me.login || '';
        document.getElementById('who').textContent =
          name ? name + (login && login !== name ? ' · ' + login : '') : login;
        const secs = (me && me.rights && me.rights.sections) || [];
        const okPhoto =
          !me ||
          me.isSystemAdmin ||
          me.role === 'admin' ||
          secs.includes('photo') ||
          secs.includes('media');
        if (!okPhoto) {
          showErr('Недостаточно прав для экрана фотографа. Откройте доступ в Персонал → матрица доступов.');
          return;
        }
      } catch (_) {}
      await refreshShift();
      await loadCategories();
      await load();
    })();
  </script>
</body>
</html>
