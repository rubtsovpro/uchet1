<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d7377" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Курьер · Учёт №1</title>
  <!-- courier-ui rev=uchetn1-20260918-courier-cards -->
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root, [data-theme="light"] {
      --bg: #e8f0f0;
      --card: #ffffff;
      --text: #0f1f1f;
      --muted: #5a6f6f;
      --line: #b8cece;
      --accent: #0d7377;
      --accent-soft: #c5e8e9;
      --danger: #b91c1c;
      --ok: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding: 12px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .chrome {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: calc(100dvh - 24px);
      width: 100%;
    }
    header.top {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: 0 2px 10px rgba(13, 50, 50, .08);
      position: sticky;
      top: 12px;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 1; }
    .brand img { width: 28px; height: 28px; border-radius: 50%; }
    .brand-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; }
    .brand-text h1 { margin: 0; font-size: 15px; font-weight: 800; color: var(--accent); white-space: nowrap; }
    .brand-text .sub { color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
    .toolbar { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .who { font-size: 12px; font-weight: 600; color: var(--muted); max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .auto-live { font-size: 12px; font-weight: 600; color: var(--muted); }
    .auto-live.is-pulse { color: var(--accent); }
    .auto-live.is-paused { color: #b45309; }
    .btn-tool {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      min-height: 36px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn-tool:active { background: var(--accent-soft); }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px;
    }
    .tab {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab b {
      min-width: 1.4em;
      text-align: center;
      background: var(--accent-soft);
      color: var(--ok);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 12px;
    }
    .tab.is-on {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .tab.is-on b { background: rgba(255,255,255,.22); color: #fff; }
    .site-switch {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 0;
    }
    .site-switch button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 36px;
    }
    .site-switch button.is-on {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .site-switch.is-locked button:not(.is-on) { display: none; }
    .findbar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
    }
    .findbar input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      background: #f7fbfb;
    }
    .findbar button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .cr-err { color: var(--danger); padding: 6px 2px; font-size: 14px; font-weight: 600; }
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    table.cr-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }
    .cr-table th, .cr-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    .cr-table th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      background: #f4fafa;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .cr-table tr:last-child td { border-bottom: 0; }
    .cr-table .title { font-weight: 700; font-size: 14px; }
    .cr-table .route { color: var(--accent); font-weight: 700; }
    .cr-table .muted { color: var(--muted); font-size: 12px; }
    .cr-table .pay-bad { color: var(--danger); font-weight: 700; }
    .cr-table .pay-ok { color: var(--ok); font-weight: 700; }
    .chip {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--ok);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      margin: 0 4px 4px 0;
    }
    .chip.is-wait { background: #fef3c7; color: #92400e; }
    .chip.is-go { background: #d1fae5; color: #065f46; }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .row-actions a, .row-actions button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }
    .row-actions button.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .row-actions button:disabled { opacity: .55; cursor: default; }
    .cr-check {
      width: 36px;
      text-align: center;
      vertical-align: middle;
    }
    .cr-check input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .selbar {
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .selbar.is-on { display: flex; }
    .selbar b { color: var(--text); }
    .cr-empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-weight: 600;
    }
    .handoffs-list { display: flex; flex-direction: column; gap: 8px; }
    .handoff-row {
      border: 2px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 14px;
      background: var(--card);
      padding: 10px 12px;
    }
    .handoff-row.is-done { opacity: 0.92; }
    .cr-card-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .cr-card-check input { width: 18px; height: 18px; accent-color: var(--accent); }
    .handoff-route-bar {
      display: flex;
      align-items: center;
      gap: 10px 14px;
      margin: 0 0 10px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
      background: linear-gradient(
        180deg,
        var(--card) 0%,
        color-mix(in srgb, var(--accent) 6%, var(--card)) 100%
      );
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }
    .handoff-route-from {
      flex: 0 1 auto;
      max-width: 38%;
      min-width: 0;
      text-align: left;
      word-break: break-word;
    }
    .handoff-route-track {
      flex: 1 1 auto;
      min-width: 48px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0;
    }
    .handoff-route-line {
      height: 0;
      border-top: 1px dashed color-mix(in srgb, var(--accent) 42%, var(--line));
    }
    .handoff-route-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
      color: var(--accent);
      box-shadow: 0 1px 3px rgba(13, 50, 50, .1);
    }
    .handoff-route-arrow svg { display: block; width: 15px; height: 15px; }
    .handoff-route-to {
      flex: 0 1 auto;
      max-width: 38%;
      min-width: 0;
      text-align: right;
      color: #1d4ed8;
      word-break: break-word;
    }
    .handoff-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .handoff-head-main { min-width: 0; flex: 1 1 auto; }
    .handoff-head strong { font-size: 16px; font-weight: 800; line-height: 1.25; word-break: break-word; }
    .handoff-done-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      font-size: 11px;
      font-weight: 800;
      vertical-align: 2px;
    }
    .handoff-meta { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; }
    .handoff-meta-deal { font-weight: 800; color: var(--text); }
    .handoff-sale-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .handoff-sale-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      border: 1.5px solid #0d7377;
      background: #e6f4f4;
      color: #0a4f52;
    }
    .handoff-sale-chip .chip-k {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      opacity: 0.85;
    }
    .handoff-sale-chip.is-pay-ok { border-color: var(--ok); background: #ecfdf5; color: #065f46; }
    .handoff-sale-chip.is-pay-bad { border-color: var(--danger); background: #fef2f2; color: #991b1b; }
    .handoff-deal-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 4px 12px;
      margin: 0 0 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 8%, var(--card));
      border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--line));
      font-size: 12px;
      line-height: 1.35;
    }
    .handoff-deal-meta .k { color: var(--muted); font-weight: 600; }
    .handoff-deal-meta a { color: inherit; }
    .handoff-lines-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.35;
      margin: 6px 0 0;
    }
    .handoff-lines-tbl th,
    .handoff-lines-tbl td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      vertical-align: top;
      text-align: left;
    }
    .handoff-lines-tbl th {
      color: var(--muted);
      font-weight: 700;
      font-size: 11px;
    }
    .handoff-lines-tbl td.num,
    .handoff-lines-tbl th.num { text-align: center; white-space: nowrap; width: 4rem; }
    .handoff-lines-tbl .art {
      display: block;
      font-weight: 700;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .handoff-actionbar {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .handoff-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .handoff-secondary.is-print { background: #0f766e; border-color: #0f766e; color: #fff; }
    .handoff-actionbar .row-actions { margin-left: auto; }
    .handoffs-empty { margin: 8px 0 0; color: var(--muted); font-weight: 600; }
    @media (max-width: 720px) {
      .who { display: none; }
      table.cr-table { min-width: 0; }
      .cr-table thead { display: none; }
      .cr-table, .cr-table tbody, .cr-table tr, .cr-table td { display: block; width: 100%; }
      .cr-table tr {
        border-bottom: 1px solid var(--line);
        padding: 12px;
      }
      .cr-table td {
        border: 0;
        padding: 4px 0;
      }
      .cr-table td::before {
        content: attr(data-label);
        display: block;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .04em;
        margin-bottom: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="chrome">
    <header class="top">
      <div class="brand">
        <img src="/logo-uchet1.svg" width="28" height="28" alt="Учёт №1" />
        <div class="brand-text">
          <h1>Курьер</h1>
          <span class="sub" id="day">—</span>
        </div>
      </div>
      <div class="toolbar">
        <span class="who" id="who" title="Сотрудник"></span>
        <span class="auto-live" id="auto-live" title="Очередь обновляется сама">авто · —</span>
        <button type="button" class="btn-tool" id="btn-print-reg" title="Реестр: все активные или отмеченные галочками">Реестр</button>
        <a class="btn-tool" href="/login" id="logout">Выйти</a>
      </div>
    </header>

    <div class="site-switch" id="site-switch" role="tablist" aria-label="Площадка">
      <button type="button" data-site="strela">Стрела</button>
      <button type="button" data-site="fogel">Фогель</button>
      <button type="button" data-site="msk">МСК</button>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab is-on" data-tab="active">Активные<b id="c-active">0</b></button>
      <button type="button" class="tab" data-tab="closed">Закрытые<b id="c-closed">0</b></button>
    </div>

    <div class="findbar">
      <input type="search" id="q" placeholder="Поиск: сделка, СДЭК, клиент, телефон…" autocomplete="off" />
      <button type="button" id="btn-find">Найти</button>
    </div>
    <div class="selbar" id="selbar">
      <label><input type="checkbox" id="chk-all" /> Выбрать все</label>
      <span>Отмечено: <b id="sel-n">0</b></span>
      <button type="button" class="btn-tool" id="btn-print-sel" style="margin-left:auto">Реестр отмеченных</button>
    </div>

    <div id="cr-msg" class="cr-err" hidden></div>
    <div class="table-wrap" id="cr-list"><p class="cr-empty">Загрузка…</p></div>
  </div>
  <script>
    let me = null;
    let tab = 'active';
    let q = '';
    let lastRefreshAt = null;
    let fetching = false;
    const SITE_KEY = 'uchet1_courier_site';
    let pickSite = 'strela';
    try {
      const u = new URL(location.href);
      const fromUrl = String(u.searchParams.get('site') || '').trim().toLowerCase();
      if (fromUrl === 'msk' || fromUrl === 'fogel' || fromUrl === 'strela') pickSite = fromUrl;
      else {
        const saved = String(localStorage.getItem(SITE_KEY) || '').trim().toLowerCase();
        if (saved === 'msk' || saved === 'fogel' || saved === 'strela') pickSite = saved;
      }
    } catch (_) {}
    const busyIds = new Set();
    /** отмеченные id заданий (активные) */
    const selected = new Set();

    function pickSiteLockFromMe() {
      const raw = String((me && me.pick_site_lock) || '').trim().toLowerCase();
      if (raw === 'msk' || raw === 'moscow' || raw === 'москва') return 'msk';
      if (raw === 'fogel' || raw === 'фогель') return 'fogel';
      if (raw === 'strela' || raw === 'стрела') return 'strela';
      return '';
    }

    function syncSiteSwitch() {
      const lock = pickSiteLockFromMe();
      const sw = document.getElementById('site-switch');
      if (lock) {
        pickSite = lock;
        if (sw) sw.classList.add('is-locked');
      } else if (sw) {
        sw.classList.remove('is-locked');
      }
      document.querySelectorAll('#site-switch [data-site]').forEach((btn) => {
        const on = btn.getAttribute('data-site') === pickSite;
        btn.classList.toggle('is-on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function setPickSite(site) {
      if (pickSiteLockFromMe()) return;
      const s = String(site || '').trim().toLowerCase();
      const next = s === 'msk' ? 'msk' : s === 'fogel' ? 'fogel' : 'strela';
      if (next === pickSite) return;
      pickSite = next;
      try { localStorage.setItem(SITE_KEY, pickSite); } catch (_) {}
      try {
        const u = new URL(location.href);
        u.searchParams.set('site', pickSite);
        history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (_) {}
      selected.clear();
      syncSiteSwitch();
      refresh({ force: true });
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtTime(d) {
      const x = d instanceof Date ? d : new Date(d);
      if (!Number.isFinite(x.getTime())) return '—';
      return x.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function isTyping() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = String(el.tagName || '').toLowerCase();
      return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
    }

    function updateAutoLabel(paused) {
      const el = document.getElementById('auto-live');
      if (!el) return;
      el.classList.toggle('is-paused', !!paused);
      if (paused) {
        el.textContent = 'пауза · ввод';
        return;
      }
      if (lastRefreshAt) {
        el.textContent = 'авто · ' + fmtTime(lastRefreshAt);
        el.classList.add('is-pulse');
        setTimeout(() => el.classList.remove('is-pulse'), 500);
      } else {
        el.textContent = 'авто · —';
      }
    }

    const apiEtagCache = new Map();
    const apiBodyCache = new Map();

    async function api(path, opts) {
      const method = String((opts && opts.method) || 'GET').toUpperCase();
      const headers = Object.assign(
        { 'Content-Type': 'application/json' },
        (opts && opts.headers) || {}
      );
      if (method === 'GET' && !(opts && opts.etag === false)) {
        const prev = apiEtagCache.get(path);
        if (prev) headers['If-None-Match'] = prev;
      }
      const r = await fetch('/api' + path, {
        credentials: 'same-origin',
        cache: 'no-store',
        ...(opts || {}),
        method,
        headers,
      });
      if (r.status === 401) {
        location.href = '/login?next=/courier.html';
        throw new Error('auth');
      }
      if (method === 'GET') {
        const et = r.headers.get('ETag');
        if (et) apiEtagCache.set(path, et);
      }
      if (r.status === 304) {
        const cached = apiBodyCache.get(path);
        if (cached && typeof cached === 'object') {
          return Object.assign({}, cached, { __notModified: true });
        }
        apiEtagCache.delete(path);
        throw new Error('not modified');
      }
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || r.statusText);
      if (method === 'GET' && data && typeof data === 'object') {
        apiBodyCache.set(path, data);
      }
      return data;
    }

    function isHandoffRun(r) {
      if (r.kind === 'handoff' || r.is_handoff) return true;
      const t = String(r.title || '') + ' ' + String(r.route_label || '');
      return /Курьер\s*→/i.test(t) || /Склад курьера/i.test(t);
    }

    function statusChip(r) {
      const st = String(r.status || '');
      if (st === 'delivered') return '<span class="chip is-go">Доставил</span>';
      if (st === 'cancelled') return '<span class="chip">Отмена</span>';
      if (isHandoffRun(r)) return '<span class="chip is-wait">К доставке</span>';
      if (st === 'picked_up') return '<span class="chip is-wait">Забрал</span>';
      if (st === 'accepted') return '<span class="chip is-wait">Принял</span>';
      return '<span class="chip is-wait">Новое</span>';
    }

    function routeLabel(r) {
      const ship = String(r.shipment_label || r.amo_shipment || '').trim();
      const fromApi = String(r.route_label || '').trim();
      if (fromApi) return fromApi;
      if (isHandoffRun(r)) return ship ? 'Курьер → ' + ship : 'Курьер → отправка';
      return String(r.title || '—');
    }

    function actionsHtml(r) {
      const st = String(r.status || '');
      const id = esc(r.id);
      const dis = busyIds.has(r.id) ? ' disabled' : '';
      if (tab === 'closed') return '<div class="row-actions"></div>';
      if (isHandoffRun(r)) {
        if (st === 'delivered' || st === 'cancelled') return '<div class="row-actions"></div>';
        return `<div class="row-actions"><button type="button" class="primary" data-id="${id}" data-st="delivered"${dis}>Доставил</button></div>`;
      }
      if (st === 'new')
        return `<div class="row-actions"><button type="button" data-id="${id}" data-st="accepted"${dis}>Принял</button></div>`;
      if (st === 'accepted')
        return `<div class="row-actions"><button type="button" data-id="${id}" data-st="picked_up"${dis}>Забрал</button></div>`;
      if (st === 'picked_up')
        return `<div class="row-actions"><button type="button" class="primary" data-id="${id}" data-st="delivered"${dis}>Выполнил</button></div>`;
      return '<div class="row-actions"></div>';
    }

    function syncSelBar(visibleIds) {
      const bar = document.getElementById('selbar');
      const show = tab === 'active';
      bar.classList.toggle('is-on', show);
      if (!show) return;
      const visible = new Set(visibleIds || []);
      [...selected].forEach((id) => {
        if (visible.size && !visible.has(id)) selected.delete(id);
      });
      const n = selected.size;
      document.getElementById('sel-n').textContent = String(n);
      const all = document.getElementById('chk-all');
      const boxes = [...document.querySelectorAll('.cr-run-chk')];
      all.checked = boxes.length > 0 && boxes.every((b) => b.checked);
      all.indeterminate = n > 0 && !all.checked;
    }

    function dealTitle(r) {
      const id = String(r.deal_id || '').trim();
      const name = String(r.deal_name || '').replace(/\s+/g, ' ').trim();
      const generic = !name || name === id || /^сделка\s*#?\s*/i.test(name);
      if (!generic) return name;
      const buyer = String(r.buyer_name || '').trim();
      if (id && buyer) return 'Заказ №' + id + ' · ' + buyer;
      if (buyer) return buyer;
      return id ? 'Заказ №' + id : String(r.title || 'Задание');
    }

    function routeBarHtml(r) {
      const route = routeLabel(r);
      const parts = String(route || '').split(/\s*→\s*/);
      const from = (parts[0] || 'Курьер').trim();
      const to = parts.length > 1 ? parts.slice(1).join(' → ').trim() : String(r.shipment_label || r.amo_shipment || '').trim();
      if (!from && !to) return '';
      return (
        '<div class="handoff-route-bar">' +
        '<span class="handoff-route-from">' + esc(from || 'Курьер') + '</span>' +
        '<span class="handoff-route-track" aria-hidden="true">' +
        '<span class="handoff-route-line"></span>' +
        '<span class="handoff-route-arrow">' +
        '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">' +
        '<path d="M2.5 8h9.5M9 5.5L12 8 9 10.5" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg></span>' +
        '<span class="handoff-route-line"></span>' +
        '</span>' +
        '<span class="handoff-route-to">' + esc(to || '—') + '</span>' +
        '</div>'
      );
    }

    function saleChipsHtml(r) {
      const chips = [];
      const chip = (k, v, cls) => {
        const val = String(v || '').trim();
        if (!val) return;
        chips.push(
          '<span class="handoff-sale-chip' + (cls ? ' ' + cls : '') + '"><span class="chip-k">' +
          esc(k) + '</span>' + esc(val) + '</span>'
        );
      };
      chip('Канал', r.amo_channel);
      chip('Отправка', r.shipment_label || r.amo_shipment);
      chip('Оплата', r.payment_label, r.is_paid ? 'is-pay-ok' : 'is-pay-bad');
      chip('Тип', r.amo_payment_type);
      if (!chips.length) return '';
      return '<div class="handoff-sale-chips">' + chips.join('') + '</div>';
    }

    function metaHtml(r) {
      const rows = [];
      const push = (k, html) => {
        const val = String(html || '').trim();
        if (!val) return;
        rows.push('<div><span class="k">' + esc(k) + '</span><br><span class="v">' + val + '</span></div>');
      };
      const buyer = String(r.buyer_name || '').trim();
      const phone = String(r.buyer_phone || '').trim();
      const who = String(r.responsible_name || '').trim();
      push('Клиент', buyer ? esc(buyer) : '');
      if (phone) {
        push(
          'Телефон',
          '<a href="tel:' + esc(phone.replace(/[^\d+]/g, '')) + '">' + esc(phone) + '</a>'
        );
      }
      push('Ответственный', who ? esc(who) : '');
      if (!rows.length) return '';
      return '<div class="handoff-deal-meta">' + rows.join('') + '</div>';
    }

    function linesHtml(r) {
      const lines = Array.isArray(r.lines) ? r.lines : [];
      if (!lines.length) return '<p class="handoffs-empty">Без строк</p>';
      const body = lines
        .map((l) => {
          const sku = String(l.sku || l.code || '').trim();
          const name = String(l.name || '').trim();
          const qty = Number(l.qty) || 0;
          return (
            '<tr><td class="name">' +
            (sku ? '<span class="art">' + esc(sku) + '</span>' : '') +
            esc(name || sku || '—') +
            '</td><td class="num"><b>' +
            esc(String(qty)) +
            '</b></td></tr>'
          );
        })
        .join('');
      return (
        '<table class="handoff-lines-tbl"><thead><tr><th>Название</th><th class="num">Кол-во</th></tr></thead><tbody>' +
        body +
        '</tbody></table>'
      );
    }

    function cardHtml(r) {
      const dealId = String(r.deal_id || '').trim();
      const title = dealTitle(r);
      const docNum = String(r.ship_doc_number || r.transfer_number || '').trim();
      const checked = selected.has(r.id) ? ' checked' : '';
      const check =
        tab === 'active'
          ? '<label class="cr-card-check"><input type="checkbox" class="cr-run-chk" data-run-id="' +
            esc(r.id) +
            '"' +
            checked +
            ' /> В реестр</label>'
          : '';
      const printHref = String(r.print_href || '').trim();
      const print = printHref
        ? '<a class="handoff-secondary is-print" href="' +
          esc(printHref) +
          (printHref.indexOf('?') >= 0 ? '&' : '?') +
          'autoprint=1" target="_blank" rel="noopener">Расходная</a>'
        : '';
      const actions = actionsHtml(r);
      const bar = print || actions
        ? '<div class="handoff-actionbar">' + print + actions + '</div>'
        : '';
      return (
        '<article class="handoff-row' +
        (tab === 'closed' ? ' is-done' : '') +
        '" data-run="' +
        esc(r.id) +
        '">' +
        check +
        routeBarHtml(r) +
        '<div class="handoff-head"><div class="handoff-head-main"><strong>' +
        esc(title) +
        '</strong>' +
        (tab === 'closed' ? ' <span class="handoff-done-badge">Закрыто</span>' : '') +
        ' <span class="muted">' +
        statusChip(r) +
        '</span>' +
        saleChipsHtml(r) +
        '</div><div class="handoff-meta">' +
        (dealId ? '<strong class="handoff-meta-deal">С' + esc(dealId) + '</strong>' : '') +
        (docNum ? (dealId ? '<br>' : '') + esc(docNum) : '') +
        '</div></div>' +
        metaHtml(r) +
        linesHtml(r) +
        bar +
        '</article>'
      );
    }

    function renderTable(items) {
      const box = document.getElementById('cr-list');
      if (!items.length) {
        box.innerHTML =
          '<p class="cr-empty">' +
          (q
            ? 'Нет заданий по запросу «' + esc(q) + '»'
            : tab === 'closed'
              ? 'Нет закрытых заданий'
              : 'Нет активных заданий') +
          '</p>';
        syncSelBar([]);
        return;
      }
      box.innerHTML = '<div class="handoffs-list">' + items.map(cardHtml).join('') + '</div>';
      bindActions(box);
      syncSelBar(items.map((r) => r.id));
    }

    function bindActions(root) {
      root.querySelectorAll('[data-st]').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const msg = document.getElementById('cr-msg');
          try {
            busyIds.add(id);
            btn.disabled = true;
            await api('/courier/runs/' + id + '/status', {
              method: 'POST',
              body: JSON.stringify({ status: btn.dataset.st }),
            });
            busyIds.delete(id);
            selected.delete(id);
            await refresh({ force: true });
          } catch (e) {
            busyIds.delete(id);
            btn.disabled = false;
            msg.hidden = false;
            msg.textContent = e.message || 'Ошибка';
          }
        };
      });
      root.querySelectorAll('.cr-run-chk').forEach((chk) => {
        chk.onchange = () => {
          const id = chk.getAttribute('data-run-id');
          if (!id) return;
          if (chk.checked) selected.add(id);
          else selected.delete(id);
          syncSelBar([...document.querySelectorAll('.cr-run-chk')].map((b) => b.getAttribute('data-run-id')));
        };
      });
    }

    function paintTabs(counts) {
      document.getElementById('c-active').textContent = String((counts && counts.active) || 0);
      document.getElementById('c-closed').textContent = String((counts && counts.closed) || 0);
      document.querySelectorAll('#tabs .tab').forEach((el) => {
        el.classList.toggle('is-on', el.getAttribute('data-tab') === tab);
      });
    }

    async function ensureMe() {
      if (me) return;
      me = await api('/me');
      const who = document.getElementById('who');
      if (who && me) {
        who.textContent = (me.name || me.login || '') + (me.role ? ' · ' + me.role : '');
      }
      const day = document.getElementById('day');
      if (day) day.textContent = new Date().toLocaleDateString('sv-SE');
    }

    async function refresh(opts) {
      const soft = !!(opts && opts.soft);
      if (fetching) return;
      if (soft && isTyping()) {
        updateAutoLabel(true);
        return;
      }
      fetching = true;
      const msg = document.getElementById('cr-msg');
      try {
        await ensureMe();
        syncSiteSwitch();
        const qs = new URLSearchParams({
          scope: tab === 'closed' ? 'closed' : 'active',
          site: pickSite,
        });
        if (q) qs.set('q', q);
        if (tab === 'closed') qs.set('limit', '80');
        const data = await api('/courier/runs?' + qs.toString());
        if (data && data.__notModified) {
          lastRefreshAt = new Date();
          updateAutoLabel(false);
          return;
        }
        if (data && data.pick_site && !pickSiteLockFromMe()) {
          const ps = String(data.pick_site || '').trim().toLowerCase();
          if (ps === 'msk' || ps === 'fogel' || ps === 'strela') pickSite = ps;
          syncSiteSwitch();
        }
        if (soft && isTyping()) {
          updateAutoLabel(true);
          return;
        }
        lastRefreshAt = new Date();
        updateAutoLabel(false);
        paintTabs(data.counts || {});
        msg.hidden = true;
        renderTable(data.items || []);
      } catch (e) {
        if (e.message === 'auth') return;
        if (!soft) {
          msg.hidden = false;
          msg.textContent = e.message || 'Ошибка';
        }
      } finally {
        fetching = false;
      }
    }

    /** Реестр: все активные или только отмеченные (onlySelected). */
    function openRegistry(onlySelected) {
      const qs = new URLSearchParams({ autoprint: '1' });
      const ids = onlySelected ? [...selected] : [];
      if (ids.length) qs.set('ids', ids.join(','));
      window.open('/api/courier/runs/print?' + qs.toString(), '_blank', 'noopener');
    }

    document.getElementById('btn-print-reg').onclick = () => openRegistry(false);
    document.getElementById('btn-print-sel').onclick = () => {
      if (!selected.size) {
        alert('Отметьте заказы галочками или нажмите «Выбрать все»');
        return;
      }
      openRegistry(true);
    };
    document.getElementById('chk-all').onchange = (e) => {
      const on = !!e.target.checked;
      document.querySelectorAll('.cr-run-chk').forEach((chk) => {
        chk.checked = on;
        const id = chk.getAttribute('data-run-id');
        if (!id) return;
        if (on) selected.add(id);
        else selected.delete(id);
      });
      syncSelBar([...document.querySelectorAll('.cr-run-chk')].map((b) => b.getAttribute('data-run-id')));
    };
    document.getElementById('tabs').onclick = (e) => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      tab = btn.getAttribute('data-tab') === 'closed' ? 'closed' : 'active';
      if (tab !== 'active') selected.clear();
      refresh({ force: true });
    };
    document.getElementById('site-switch').onclick = (e) => {
      const btn = e.target && e.target.closest ? e.target.closest('[data-site]') : null;
      if (!btn) return;
      setPickSite(btn.getAttribute('data-site'));
    };
    document.getElementById('btn-find').onclick = () => {
      q = String(document.getElementById('q').value || '').trim();
      refresh({ force: true });
    };
    document.getElementById('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        q = String(e.target.value || '').trim();
        refresh({ force: true });
      }
    });

    updateAutoLabel(false);
    refresh({ force: true });
    setInterval(() => {
      if (document.visibilityState === 'hidden') return;
      if (tab !== 'active') return;
      refresh({ soft: true }).catch(() => {});
    }, 25000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refresh({ soft: true }).catch(() => {});
    });
  </script>
</body>
</html>
