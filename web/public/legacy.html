<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Учёт №1</title>
  <link rel="icon" href="/logo-uchet1.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=527" />
</head>
<body class="taxi-body">
  <div class="taxi">
    <header class="taxi-top is-loading">
      <div class="taxi-top-stripe" aria-hidden="true"></div>
      <img class="taxi-logo" src="/logo-uchet1.svg" width="28" height="28" alt="Учёт №1" />
      <button type="button" class="taxi-burger" id="btn-burger" title="Показать / скрыть меню" aria-label="Показать или скрыть меню" aria-controls="taxi-side" aria-expanded="true">
        <span></span><span></span><span></span>
      </button>
      <div class="taxi-title" id="top-title">
        <span class="taxi-product">Учёт №1</span>
        <label class="taxi-org-wrap" title="Контур организации">
          <span class="sr-only">Организация</span>
          <select id="header-company" class="taxi-org-select" aria-label="Организация (контур)">
            <option value="">Все организации</option>
          </select>
        </label>
      </div>

      <div class="taxi-top-actions">
        <div class="header-rates" id="header-rates" hidden title="Курсы ЦБ РФ"></div>
        <div class="presence-wrap" id="presence-wrap">
          <button type="button" class="taxi-presence" id="presence-btn" hidden title="Кто в системе">
            <span class="presence-dot" aria-hidden="true"></span>
            <span id="presence-count">0</span> онлайн
          </button>
          <div class="presence-panel" id="presence-panel" hidden></div>
        </div>
        <span class="taxi-user" id="taxi-user">…</span>
        <button type="button" class="taxi-ico taxi-logout" id="logout" title="Выйти">Выйти</button>
      </div>
    </header>

    <div class="taxi-favs" id="favs" hidden aria-label="Закладки"></div>

    <div class="taxi-tabs" id="tabs" aria-label="Открытые вкладки"></div>

    <div class="taxi-body-row">
      <aside class="taxi-side" id="taxi-side">
        <div class="taxi-side-head">
          <span class="taxi-side-label">Разделы</span>
          <button type="button" class="taxi-side-collapse" id="btn-side-collapse" title="Скрыть меню" aria-label="Скрыть меню">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <nav class="taxi-sections" id="sections">
          <a class="sec active" href="/" data-section="home" title="Главное">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 8.5L9 3l6 5.5V15H11v-4H7v4H3z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="sec-label">Главное</span>
          </a>
          <a class="sec" href="/crm" data-section="crm" title="CRM" hidden aria-hidden="true">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 14c1-3 9-3 10 0" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="sec-label">CRM</span>
          </a>
          <a class="sec" href="/sales" data-section="sales" title="Продажи">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12v9H3zM6 5V4h6v1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="sec-label">Продажи</span>
          </a>
          <a class="sec" href="/documents" data-section="documents" title="Документы">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 2.5h5l3 3V15.5H5z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 2.5V5.5h3M7 9h4M7 11.5h4M7 14h2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            <span class="sec-label">Документы</span>
          </a>
          <a class="sec" href="/purchases" data-section="purchases" title="Закупки">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4h12l-1 8H4L3 4zm2 11a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="sec-label">Закупки</span>
          </a>
          <a class="sec" href="/warehouses" data-section="warehouse" title="Склад">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7l7-4 7 4v7H2V7zM2 7h14M9 3v11" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="sec-label">Склад</span>
          </a>
          <a class="sec" href="/works" data-section="works" title="Работы" hidden aria-hidden="true">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 14l4-4 2 2 4-5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="14" cy="5" r="1.5" fill="currentColor"/></svg>
            <span class="sec-label">Работы</span>
          </a>
          <a class="sec" href="/production" data-section="production" title="Производство" hidden aria-hidden="true">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 14V8l3-2 3 2 3-2 3 2v6H3z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="sec-label">Производство</span>
          </a>
          <a class="sec" href="/money" data-section="money" title="Деньги">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9 5v8M7 7.5c.5-1 4-1 4 1s-3.5 1.5-4 2.5c-.4.8 2.5 1.5 4 .8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            <span class="sec-label">Деньги</span>
          </a>
          <a class="sec" href="/staff" data-section="staff" title="Персонал">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 14c.5-2.5 7-2.5 7.5 0M12 7.5a1.8 1.8 0 110-3.5M13.5 14c.3-1.5 3-1.8 3.5 0" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            <span class="sec-label">Персонал</span>
          </a>
          <a class="sec" href="/chats" data-section="chats" title="Чаты">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 4.5h11v8H8l-2.5 2v-2H3.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.5 8h5M6.5 10h3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            <span class="sec-label">Чаты</span>
          </a>
          <a class="sec" href="/company" data-section="company" title="Компания">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 15V5l5-2 5 2v10H4zM7 15v-4h4v4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="sec-label">Компания</span>
          </a>
          <a class="sec" href="/settings" data-section="settings" title="Настройки">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9 2.5v2M9 13.5v2M2.5 9h2M13.5 9h2M4.2 4.2l1.4 1.4M12.4 12.4l1.4 1.4M4.2 13.8l1.4-1.4M12.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.2"/></svg>
            <span class="sec-label">Настройки</span>
          </a>
          <a class="sec" href="/ideas" data-section="ideas" title="Идеи и ошибки" hidden aria-hidden="true">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2.5a4 4 0 014 4c0 1.6-.8 2.6-1.6 3.5-.5.5-.9 1.1-1 1.8H7.6c-.1-.7-.5-1.3-1-1.8C5.8 9.1 5 8.1 5 6.5a4 4 0 014-4zM7.5 13.5h3M7.8 15h2.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span class="sec-label">Идеи и ошибки</span>
          </a>
          <a class="sec" href="/kassa" data-section="kassa" title="Касса">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 6.5h11v8.5h-11zM5.5 6.5V4.8h7v1.7M6.5 9.5h5M6.5 12h3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 3.2h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span class="sec-label">Касса</span>
          </a>
          <a class="sec" href="/help" data-section="help" title="Помощь">
            <svg class="sec-svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 7a2 2 0 013.5 1.2c0 1.3-1.5 1.5-1.5 2.8M9 13h.01" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span class="sec-label">Помощь</span>
          </a>
        </nav>
      </aside>

      <main class="taxi-main app">
        <div id="section-panel" class="section-panel hidden"></div>
        <div id="view"></div>
      </main>
    </div>

  </div>

  <div id="chat-fab-root" class="chat-fab-root" hidden>
    <div id="chat-pop" class="chat-pop hidden" role="dialog" aria-label="Чаты">
      <div class="chat-pop-head">
        <strong>Чаты</strong>
        <span class="chat-pop-unread muted" id="chat-pop-unread"></span>
        <div class="grow"></div>
        <a class="chat-pop-link" href="/chats" id="chat-pop-full">Открыть</a>
        <button type="button" class="chat-pop-x" id="chat-pop-close" title="Закрыть" aria-label="Закрыть">✕</button>
      </div>
      <div id="chat-pop-body" class="chat-pop-body">
        <p class="muted" style="margin:12px">Загрузка…</p>
      </div>
    </div>
    <button type="button" class="chat-fab" id="chat-fab" title="Чаты" aria-label="Чаты">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5.5h16v11H9.5L6 20v-3.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 10h8M8 13h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="chat-fab-badge" id="chat-fab-badge" hidden>0</span>
    </button>
  </div>

  <script>
    // Надёжная загрузка: во встроенном браузере IDE defer на ~400KB часто не отрабатывает.
    (function () {
      var LEGACY_SRC = '/legacy.js?v=631';
      var EXTRAS = [
        '/sections-parity-a.js?v=59',
        '/sections-crm-ops.js?v=1',
        '/sections-parity-money.js?v=489',
        '/sections-parity-wave-b.js?v=8',
        '/sections-cdek.js?v=4',
      ];
      var view = document.getElementById('view');
      function showErr(msg) {
        if (!view) return;
        view.innerHTML = '<p class="error" style="padding:16px">' + msg + '</p>';
      }
      function loadSrc(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error(src)); };
          document.head.appendChild(s);
        });
      }
      function loadTextFallback(src) {
        return fetch(src, { credentials: 'same-origin', cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error(src + ' HTTP ' + r.status);
          return r.text();
        }).then(function (code) {
          var s = document.createElement('script');
          s.text = code;
          document.head.appendChild(s);
        });
      }
      function loadOne(src) {
        return loadSrc(src).catch(function () {
          return loadTextFallback(src);
        });
      }
      if (view && !view.innerHTML) {
        view.innerHTML = '<p class="muted" style="padding:16px">Загрузка…</p>';
      }
      // Как раньше: сначала parity-секции (регистрируют window.Wms*), потом legacy (install + UI).
      var chain = Promise.resolve();
      EXTRAS.forEach(function (src) {
        chain = chain.then(function () {
          return loadOne(src).catch(function (e) {
            console.warn('[wms] optional script failed', src, e);
          });
        });
      });
      chain
        .then(function () {
          return loadOne(LEGACY_SRC);
        })
        .catch(function (e) {
          console.error('[wms] legacy load failed', e);
          showErr(
            'Не загрузился основной скрипт (' +
              (e && e.message ? e.message : 'network') +
              '). Откройте https://1c.pnevmopodveska1.ru в обычном Chrome/Safari (не во встроенном браузере).'
          );
        });

      setTimeout(function () {
        if (!view) return;
        if (window.WmsLegacy || window.__WMS_LEGACY_BOOT__) {
          var html = (view.innerHTML || '').trim();
          var bootOnly =
            !html ||
            /^<p class="muted"[^>]*>Загрузка(…|\.\.\.| начальной страницы…)?<\/p>$/.test(html);
          if (bootOnly) {
            view.innerHTML =
              '<p class="error" style="padding:16px">Скрипт есть, но ответ API не пришёл. Обновите страницу или откройте в Chrome/Safari.</p>';
          }
          return;
        }
        if (!view.innerHTML || /Загрузка/.test(view.innerHTML)) {
          showErr(
            'Не загрузился основной скрипт. Откройте сайт в обычном Chrome/Safari (встроенный браузер IDE часто режет большой JS).'
          );
        }
      }, 15000);
    })();
  </script>
</body>
</html>
