<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d7377" />
  <link rel="icon" href="/logo-uchet1.svg" type="image/svg+xml" />
  <title>Отчёт фотографа · Учёт №1</title>
  <style>
    :root, [data-theme="light"] {
      --bg: #e8f0f0;
      --card: #ffffff;
      --text: #0f1f1f;
      --muted: #5a6f6f;
      --line: #b8cece;
      --accent: #0d7377;
      --accent-soft: #c5e8e9;
      --shadow: 0 2px 10px rgba(13, 50, 50, .08);
    }
    [data-theme="dark"] {
      --bg: #0c1414;
      --card: #1a2828;
      --text: #e8f4f4;
      --muted: #8aa0a0;
      --line: #2a4040;
      --accent: #2dd4bf;
      --accent-soft: #134e4a;
      --shadow: 0 2px 14px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
    }
    .chrome { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    header.top {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; box-shadow: var(--shadow);
    }
    header.top h1 { margin: 0; font-size: 16px; color: var(--accent); font-weight: 800; }
    .toolbar { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .btn-tool {
      appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-tool.primary { background: var(--accent); color: #fff; border-color: transparent; }
    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: end;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; box-shadow: var(--shadow);
    }
    .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .filters input {
      min-height: 40px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); padding: 6px 10px; font-size: 14px;
    }
    .totals {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .totals span {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; font-size: 12px; color: var(--muted); box-shadow: var(--shadow);
    }
    .totals b { display: block; margin-top: 2px; font-size: 20px; color: var(--text); font-variant-numeric: tabular-nums; }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px; box-shadow: var(--shadow); overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; color: var(--muted); font-weight: 700; }
    td.mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .err {
      background: #fde8e8; color: #c0392b; border-radius: 12px; padding: 10px 12px; font-size: 14px;
    }
    [data-theme="dark"] .err { background: #3f1d1d; color: #ef4444; }
    .muted { color: var(--muted); }
    @media (max-width: 640px) {
      .totals { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="chrome">
    <header class="top">
      <h1>Отчёт · смены фотографа</h1>
      <div class="toolbar">
        <a class="btn-tool" href="/photo">← К очереди</a>
        <button type="button" class="btn-tool primary" id="reload">Обновить</button>
      </div>
    </header>

    <div class="filters">
      <label>С <input type="date" id="from" /></label>
      <label>По <input type="date" id="to" /></label>
      <button type="button" class="btn-tool primary" id="apply">Показать</button>
    </div>

    <div class="totals" id="totals">
      <span>Смен<b>—</b></span>
      <span>Товаров<b>—</b></span>
      <span>Фото<b>—</b></span>
      <span>Файлов<b>—</b></span>
    </div>

    <div id="err" class="err" hidden></div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>День</th>
            <th>Фотограф</th>
            <th>Смен</th>
            <th>Товаров</th>
            <th>Фото</th>
            <th>Файлов</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="muted">Загрузка…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );
    }

    async function api(path) {
      const res = await fetch('/api' + path, { credentials: 'same-origin' });
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname || '/photo/report');
        throw new Error('login');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function defaultRange() {
      const to = new Date();
      const from = new Date();
      from.setDate(from.getDate() - 13);
      const fmt = (d) => d.toISOString().slice(0, 10);
      document.getElementById('from').value = fmt(from);
      document.getElementById('to').value = fmt(to);
    }

    function renderTotals(t) {
      const el = document.getElementById('totals');
      el.innerHTML =
        '<span>Смен<b>' + esc(t.shifts_count || 0) + '</b></span>' +
        '<span>Товаров<b>' + esc(t.products_done || 0) + '</b></span>' +
        '<span>Фото<b>' + esc(t.photos_uploaded || 0) + '</b></span>' +
        '<span>Файлов<b>' + esc(t.files_uploaded || 0) + '</b></span>';
    }

    async function load() {
      const err = document.getElementById('err');
      err.hidden = true;
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const qs = new URLSearchParams();
      if (from) qs.set('from', from);
      if (to) qs.set('to', to);
      try {
        const data = await api('/media/photo/report?' + qs.toString());
        renderTotals(data.totals || {});
        const items = data.items || [];
        const tbody = document.getElementById('rows');
        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="muted">Нет смен за период</td></tr>';
          return;
        }
        tbody.innerHTML = items.map((it) =>
          '<tr>' +
            '<td class="mono">' + esc(it.day) + '</td>' +
            '<td>' + esc(it.staff_name || it.staff_login || '—') + '</td>' +
            '<td class="mono">' + esc(it.shifts_count) + '</td>' +
            '<td class="mono">' + esc(it.products_done) + '</td>' +
            '<td class="mono">' + esc(it.photos_uploaded) + '</td>' +
            '<td class="mono">' + esc(it.files_uploaded) + '</td>' +
          '</tr>'
        ).join('');
      } catch (e) {
        if (e.message !== 'login') {
          err.hidden = false;
          err.textContent = e.message || 'Ошибка';
        }
      }
    }

    document.getElementById('apply').onclick = () => load();
    document.getElementById('reload').onclick = () => load();
    defaultRange();
    load();
  </script>
</body>
</html>
