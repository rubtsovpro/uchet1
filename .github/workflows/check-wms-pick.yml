name: Check WMS pick
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set +e
            echo "=== deal 25840845 ==="
            python3 -c "
            import sqlite3
            deal='25840845'
            db='/root/1c_pnevmopodveska1_ru/warehouse/data/warehouse.sqlite'
            con=sqlite3.connect('file:%s?mode=ro'%db, uri=True)
            con.row_factory=sqlite3.Row
            def show(title,sql,args=()):
                print('===',title,'===')
                try:
                    rows=con.execute(sql,args).fetchall()
                except Exception as e:
                    print('ERR',e); return
                if not rows:
                    print('(empty)'); return
                cols=rows[0].keys()
                print(' | '.join(cols))
                for r in rows:
                    print(' | '.join(str(r[c] if r[c] is not None else '')[:180] for c in cols))
            show('deal','SELECT id, name, amo_channel, amo_status FROM crm_deals WHERE id=?',(deal,))
            show('items','SELECT line_no, sku, name, qty, product_guid FROM crm_deal_items WHERE deal_id=? ORDER BY line_no',(deal,))
            show('stock_docs','SELECT id, number, doc_type, posted, substr(comment,1,180) comment, created_at FROM stock_docs WHERE deal_id=? ORDER BY datetime(created_at) DESC LIMIT 30',(deal,))
            show('open drafts','SELECT id, number, posted, substr(comment,1,180) FROM stock_docs WHERE deal_id=? AND IFNULL(posted,0)=0',(deal,))
            show('open draft lines','SELECT l.doc_id, l.qty, IFNULL(p.sku,\"\") sku FROM stock_doc_lines l JOIN stock_docs d ON d.id=l.doc_id LEFT JOIN products p ON p.id=l.product_id WHERE d.deal_id=? AND IFNULL(d.posted,0)=0',(deal,))
            show('meta','SELECT key, substr(value,1,400) FROM meta WHERE key LIKE ?',('%'+deal+'%',))
            print('DONE')
            "
            echo "=== service ==="
            systemctl is-active warehouse-wms
            systemctl status warehouse-wms --no-pager -l | head -30
            echo "=== listen ==="
            ss -lntp | grep -E '3101|node' | head -20
            echo "=== local health ==="
            curl -sS -m 5 -o /tmp/h.txt -w "health %{http_code} time=%{time_total}\n" http://127.0.0.1:3101/api/health
            head -c 200 /tmp/h.txt; echo
            echo "=== pick html local ==="
            curl -sS -m 10 -o /dev/null -w "pick %{http_code} time=%{time_total}\n" http://127.0.0.1:3101/pick
            curl -sS -m 10 -o /dev/null -w "pick_public %{http_code}\n" http://127.0.0.1:3101/public/pick.html
            echo "=== nginx ==="
            curl -sS -m 10 -o /dev/null -w "nginx_pick %{http_code} time=%{time_total}\n" -H 'Host: uchetn1.ru' http://127.0.0.1/pick
            curl -sS -m 15 -o /dev/null -w "ext_pick %{http_code} time=%{time_total}\n" https://uchetn1.ru/pick
            echo "=== journal ==="
            journalctl -u warehouse-wms -n 60 --no-pager
            echo "=== load ==="
            uptime; free -m | head -3
            ps aux --sort=-%cpu | head -12
            echo "=== sqlite ==="
            ls -lh /root/1c_pnevmopodveska1_ru/warehouse/data/warehouse.sqlite* 2>/dev/null | head -10
            echo DONE
