# Deploy prod — ЗАБЛОКИРОВАН (запрет отката).
# Не включать workflow_run и не делать git reset --hard на VPS,
# пока origin/main не = актуальный прод (после полного sync-коммита).
# Пользователь: «ничего нельзя откатывать».
name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введите NO-ROLLBACK только для проверки (деплой всё равно не катит код)'
        required: true
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  blocked:
    name: Deploy blocked (no rollback)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any prod reset
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          TELEGRAM_WORKER_SECRET: ${{ secrets.TELEGRAM_WORKER_SECRET }}
        run: |
          set -euo pipefail
          MSG='🚫 uchet1 Deploy prod ЗАБЛОКИРОВАН: запрещён git reset/clean на VPS (откат кода). Сначала sync всего дерева в main, потом явно разблокировать.'
          echo "$MSG"
          if [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
            BODY=$(jq -n --arg t "$TELEGRAM_BOT_TOKEN" --arg c "$TELEGRAM_CHAT_ID" --arg x "$MSG" \
              '{token:$t, method:"sendMessage", params:{chat_id:$c, text:$x, disable_web_page_preview:true}}')
            if [[ -n "${TELEGRAM_WORKER_URL:-}" ]]; then
              [[ -n "${TELEGRAM_WORKER_SECRET:-}" ]] && BODY=$(echo "$BODY" | jq --arg s "$TELEGRAM_WORKER_SECRET" '. + {secret:$s}')
              curl -sS -X POST "${TELEGRAM_WORKER_URL%/}/tg-api" -H 'Content-Type: application/json' -d "$BODY" >/dev/null || true
            else
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null || true
            fi
          fi
          exit 1
