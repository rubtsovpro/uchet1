name: Verify se services
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            php -r '
            $pdo=new PDO("sqlite:/root/1c_pnevmopodveska1_ru/warehouse/data/warehouse.sqlite");
            echo "=== se-* ===\n";
            $q=$pdo->query("SELECT sku, IFNULL(is_active,1) act, name FROM products WHERE lower(IFNULL(sku,\"\")) LIKE \"se-%\" ORDER BY sku");
            foreach($q as $r) echo $r["sku"]."\t".$r["act"]."\t".$r["name"]."\n";
            echo "=== active non-se services ===\n";
            $q=$pdo->query("SELECT sku, name FROM products WHERE IFNULL(is_active,1)=1 AND IFNULL(item_kind,\"\") IN (\"service\",\"услуга\") AND lower(IFNULL(sku,\"\")) NOT LIKE \"se-%\" ORDER BY sku LIMIT 40");
            foreach($q as $r) echo ($r["sku"]?:"(empty)")."\t".$r["name"]."\n";
            $seAll=$pdo->query("SELECT COUNT(*) c FROM products WHERE lower(sku) LIKE \"se-%\"")->fetch()["c"];
            $seAct=$pdo->query("SELECT COUNT(*) c FROM products WHERE lower(sku) LIKE \"se-%\" AND IFNULL(is_active,1)=1")->fetch()["c"];
            $non=$pdo->query("SELECT COUNT(*) c FROM products WHERE IFNULL(is_active,1)=1 AND IFNULL(item_kind,\"\") IN (\"service\",\"услуга\") AND lower(sku) NOT LIKE \"se-%\"")->fetch()["c"];
            echo "counts se_all=$seAll se_act=$seAct svc_act_nonse=$non\n";
            '
