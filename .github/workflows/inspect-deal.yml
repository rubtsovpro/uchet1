name: Inspect deal stock
on:
  workflow_dispatch:
    inputs:
      deal_id:
        description: Amo deal id
        required: true
        default: '25840845'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query sqlite
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script_stop: false
          script: |
            set +e
            DEAL="${{ github.event.inputs.deal_id }}"
            DB=/root/1c_pnevmopodveska1_ru/warehouse/data/warehouse.sqlite
            echo "=== deal $DEAL ==="
            sqlite3 -readonly "$DB" <<SQL
            .mode column
            .headers on
            SELECT id, name, amo_channel, amo_status FROM crm_deals WHERE id='$DEAL';
            SELECT '--- items ---';
            SELECT line_no, sku, name, qty, product_guid FROM crm_deal_items WHERE deal_id='$DEAL' ORDER BY line_no;
            SELECT '--- stock_docs ---';
            SELECT id, number, doc_type, posted, warehouse_id, warehouse_to_id, substr(comment,1,180) AS comment, created_at
            FROM stock_docs WHERE deal_id='$DEAL' ORDER BY datetime(created_at) DESC LIMIT 30;
            SELECT '--- open drafts ---';
            SELECT id, number, posted, substr(comment,1,180)
            FROM stock_docs WHERE deal_id='$DEAL' AND IFNULL(posted,0)=0;
            SELECT '--- lines of open drafts ---';
            SELECT l.doc_id, l.product_id, l.qty, p.sku, p.name
            FROM stock_doc_lines l
            JOIN stock_docs d ON d.id=l.doc_id
            LEFT JOIN products p ON p.id=l.product_id
            WHERE d.deal_id='$DEAL' AND IFNULL(d.posted,0)=0;
            SELECT '--- meta return/handoff ---';
            SELECT key, substr(value,1,400) FROM meta WHERE key LIKE '%$DEAL%';
            SELECT '--- warehouse_tasks ---';
            SELECT id, number, status, channel, substr(comment,1,160), created_at, updated_at
            FROM warehouse_tasks WHERE deal_id='$DEAL' ORDER BY datetime(created_at) DESC LIMIT 20;
            SELECT '--- balances by deal products ---';
            SELECT b.warehouse_id, w.code, w.name, b.product_id, p.sku, b.qty
            FROM stock_balances b
            LEFT JOIN warehouses w ON w.id=b.warehouse_id
            LEFT JOIN products p ON p.id=b.product_id
            WHERE b.qty>0 AND b.product_id IN (SELECT product_guid FROM crm_deal_items WHERE deal_id='$DEAL');
            SQL
            echo DONE
