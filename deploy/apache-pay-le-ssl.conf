# HTTPS → pay.pnevmopodveska1.ru (после certbot)

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pay.pnevmopodveska1.ru
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyRequests Off
    Timeout 120

    ProxyPass /api/public/ http://127.0.0.1:3101/api/public/
    ProxyPassReverse /api/public/ http://127.0.0.1:3101/api/public/

    ProxyPass /pay-demo http://127.0.0.1:3101/pay-demo
    ProxyPassReverse /pay-demo http://127.0.0.1:3101/pay-demo
    ProxyPass /pay-demo.html http://127.0.0.1:3101/pay-demo.html
    ProxyPassReverse /pay-demo.html http://127.0.0.1:3101/pay-demo.html
    ProxyPass /pay.html http://127.0.0.1:3101/pay.html
    ProxyPassReverse /pay.html http://127.0.0.1:3101/pay.html
    ProxyPass /pay/ http://127.0.0.1:3101/pay/
    ProxyPassReverse /pay/ http://127.0.0.1:3101/pay/
    ProxyPass /pay http://127.0.0.1:3101/pay
    ProxyPassReverse /pay http://127.0.0.1:3101/pay

    ProxyPass /logo-uchet1.svg http://127.0.0.1:3101/logo-uchet1.svg
    ProxyPass /logo-pnevmopodveska.svg http://127.0.0.1:3101/logo-pnevmopodveska.svg
    ProxyPass /favicon.svg http://127.0.0.1:3101/favicon.svg
    ProxyPass /favicon.ico http://127.0.0.1:3101/favicon.svg

    RewriteEngine On
    RewriteRule ^/api/public/ - [L]
    RewriteRule ^/pay - [L]
    RewriteRule ^/logo- - [L]
    RewriteRule ^/favicon - [L]
    RewriteRule ^ https://pnevmopodveska1.ru/ [R=302,L]

    ErrorLog ${APACHE_LOG_DIR}/pay-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/pay-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pay.pnevmopodveska1.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pay.pnevmopodveska1.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
