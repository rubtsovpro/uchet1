# Учёт №1 — домен + ролевые поддомены + api → один WMS (Node :3101)
# См. deploy/DNS-uchetn1.md
#
# cp deploy/apache-uchetn1-screens.conf /etc/apache2/sites-available/uchetn1.conf
# a2ensite uchetn1.conf && apache2ctl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName uchetn1.ru
    ServerAlias www.uchetn1.ru
    ServerAlias api.uchetn1.ru
    ServerAlias www.api.uchetn1.ru
    ServerAlias pick.uchetn1.ru
    ServerAlias www.pick.uchetn1.ru
    ServerAlias photo.uchetn1.ru
    ServerAlias www.photo.uchetn1.ru
    ServerAlias lift.uchetn1.ru
    ServerAlias www.lift.uchetn1.ru
    ServerAlias in.uchetn1.ru
    ServerAlias www.in.uchetn1.ru
    ServerAlias reception.uchetn1.ru
    ServerAlias www.reception.uchetn1.ru
    ServerAlias swagger.uchetn1.ru
    ServerAlias www.swagger.uchetn1.ru

    DocumentRoot /root/1c_pnevmopodveska1_ru/public_html
    <Directory /root/1c_pnevmopodveska1_ru/public_html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <LocationMatch "(?i)\.(yaml|yml)$">
        Require all denied
    </LocationMatch>

    RewriteEngine On
    # Let's Encrypt HTTP-01
    RewriteRule ^/\.well-known/acme-challenge/ - [L]

    # Landing по Host (Node дублирует)
    RewriteCond %{HTTP_HOST} ^(www\.)?pick\.uchetn1\.ru$ [NC]
    RewriteRule ^/?$ /pick [R=302,L]
    RewriteCond %{HTTP_HOST} ^(www\.)?photo\.uchetn1\.ru$ [NC]
    RewriteRule ^/?$ /photo [R=302,L]
    RewriteCond %{HTTP_HOST} ^(www\.)?lift\.uchetn1\.ru$ [NC]
    RewriteRule ^/?$ /lift [R=302,L]
    RewriteCond %{HTTP_HOST} ^(www\.)?(in|reception)\.uchetn1\.ru$ [NC]
    RewriteRule ^/?$ /reception [R=302,L]
    # Swagger: короткий путь → Node /api/swagger (не PHP /swagger)
    RewriteCond %{HTTP_HOST} ^(www\.)?swagger\.uchetn1\.ru$ [NC]
    RewriteRule ^/(swagger|docs)/?$ /api/swagger [R=302,L]
    RewriteCond %{HTTP_HOST} ^(www\.)?swagger\.uchetn1\.ru$ [NC]
    RewriteRule ^/?$ /api/swagger [R=302,L]

    # HTTPS только для имён с уже выпущенным сертификатом
    RewriteCond %{SERVER_NAME} =www.uchetn1.ru [OR]
    RewriteCond %{SERVER_NAME} =uchetn1.ru
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /.well-known !
    # /docs → WMS (расходные накладные). Дока amo1c — /amo-docs
    Alias /amo-docs /root/amo1c_pnevmopodveska1_ru/public_html/docs
    <Directory /root/amo1c_pnevmopodveska1_ru/public_html/docs>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ProxyPass /amo-docs !
    ProxyPass /swagger !
    ProxyPass /css !
    ProxyPass /js !
    ProxyPass /favicon.svg !
    ProxyPassMatch ^/docs-openapi-deny\.htaccess$ !

    ProxyPass /api http://127.0.0.1:3101/api
    ProxyPassReverse /api http://127.0.0.1:3101/api
    ProxyPass /login http://127.0.0.1:3101/login
    ProxyPassReverse /login http://127.0.0.1:3101/login
    ProxyPass /styles.css http://127.0.0.1:3101/styles.css
    ProxyPass /app.js http://127.0.0.1:3101/app.js
    ProxyPass / http://127.0.0.1:3101/
    ProxyPassReverse / http://127.0.0.1:3101/

    ErrorLog ${APACHE_LOG_DIR}/uchetn1-error.log
    CustomLog ${APACHE_LOG_DIR}/uchetn1-access.log combined
</VirtualHost>
