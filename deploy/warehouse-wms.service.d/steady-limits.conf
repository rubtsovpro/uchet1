# Steady-state WMS limits (после 502/sqlite lock 2026-09-14).
# Один drop-in вместо emergency-light / sync-limit / zz-emergency.
# Install:
#   mkdir -p /etc/systemd/system/warehouse-wms.service.d
#   cp deploy/warehouse-wms.service.d/steady-limits.conf /etc/systemd/system/warehouse-wms.service.d/
#   rm -f /etc/systemd/system/warehouse-wms.service.d/emergency-light.conf \
#         /etc/systemd/system/warehouse-wms.service.d/sync-limit.conf \
#         /etc/systemd/system/warehouse-wms.service.d/zz-emergency.conf
#   systemctl daemon-reload && systemctl restart warehouse-wms
#
# Не ставить WMS_SYNC_MAX_CONCURRENT=0 насовсем и не stub'ить nginx /api/webhooks/amo.
[Service]
Environment=GDRIVE_PURCHASE_POLL=0
Environment=WMS_SYNC_MAX_CONCURRENT=1
Environment=WMS_SYNC_CHILD_TIMEOUT_MS=25000
Environment=AMO_WEBHOOK_SYNC_MAX=8
# API только ставит в очередь; pump — warehouse-wms-worker
Environment=WMS_SYNC_PUMP=0
# Postgres SoT (1:1 dump) + cluster
Environment=WMS_SOURCE_OF_TRUTH=postgres
Environment=WMS_CLUSTER_WORKERS=4
# Event-loop watchdog
Environment=WMS_EVENT_LOOP_WARN_MS=500
Environment=WMS_EVENT_LOOP_KILL_MS=0
Environment=WMS_EVENT_LOOP_KILL_AFTER_MS=20000
ExecStart=
ExecStart=/usr/bin/node dist/cluster.js
