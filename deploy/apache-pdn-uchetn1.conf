# HTTP → pdn.uchetn1.ru — публичная SMS-подпись согласия ПДн
# DNS: A pdn → 155.212.160.31
# SSL: certbot --apache -d pdn.uchetn1.ru -d www.pdn.uchetn1.ru

<VirtualHost *:80>
    ServerName pdn.uchetn1.ru
    ServerAlias www.pdn.uchetn1.ru
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyRequests Off
    Timeout 120

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPass /api/ http://127.0.0.1:3101/api/
    ProxyPassReverse /api/ http://127.0.0.1:3101/api/
    ProxyPass /pdn http://127.0.0.1:3101/pdn
    ProxyPassReverse /pdn http://127.0.0.1:3101/pdn
    ProxyPass /pdn.html http://127.0.0.1:3101/pdn.html
    ProxyPassReverse /pdn.html http://127.0.0.1:3101/pdn.html
    ProxyPass /logo-uchet1.svg http://127.0.0.1:3101/logo-uchet1.svg
    ProxyPass /favicon.svg http://127.0.0.1:3101/favicon.svg
    ProxyPass /favicon.ico http://127.0.0.1:3101/favicon.svg
    ProxyPass /brand/ http://127.0.0.1:3101/brand/
    ProxyPassReverse /brand/ http://127.0.0.1:3101/brand/

    # Корень и короткие токены /{token}
    ProxyPass / http://127.0.0.1:3101/
    ProxyPassReverse / http://127.0.0.1:3101/

    ErrorLog ${APACHE_LOG_DIR}/pdn-uchetn1-error.log
    CustomLog ${APACHE_LOG_DIR}/pdn-uchetn1-access.log combined
</VirtualHost>
