# HTTPS (haproxy → 127.0.0.1:8443) — pdn.pnevmopodveska1.ru
# Cert: certbot certonly --webroot -w /var/www/html -d pdn.pnevmopodveska1.ru

<IfModule mod_ssl.c>
<VirtualHost 127.0.0.1:8443>
    Protocols h2 http/1.1
    ServerName pdn.pnevmopodveska1.ru
    ServerAlias www.pdn.pnevmopodveska1.ru

    ProxyPreserveHost On
    ProxyRequests Off
    Timeout 120

    ProxyPass /api/ http://127.0.0.1:3101/api/
    ProxyPassReverse /api/ http://127.0.0.1:3101/api/
    ProxyPass /pdn http://127.0.0.1:3101/pdn
    ProxyPassReverse /pdn http://127.0.0.1:3101/pdn
    ProxyPass /pdn.html http://127.0.0.1:3101/pdn.html
    ProxyPassReverse /pdn.html http://127.0.0.1:3101/pdn.html
    ProxyPass /brand/ http://127.0.0.1:3101/brand/
    ProxyPassReverse /brand/ http://127.0.0.1:3101/brand/
    ProxyPass /favicon.svg http://127.0.0.1:3101/favicon.svg
    ProxyPass /favicon.ico http://127.0.0.1:3101/favicon.svg

    ProxyPass / http://127.0.0.1:3101/
    ProxyPassReverse / http://127.0.0.1:3101/

    ErrorLog ${APACHE_LOG_DIR}/pdn-pnevmo-error.log
    CustomLog ${APACHE_LOG_DIR}/pdn-pnevmo-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pdn.pnevmopodveska1.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pdn.pnevmopodveska1.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
