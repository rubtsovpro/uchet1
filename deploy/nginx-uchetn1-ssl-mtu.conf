# TLS for uchetn1 / pick / 1c — small SSL records (MTU-safe)
# Used behind HAProxy SNI on :443 → 127.0.0.1:4443 (PROXY protocol v2)
#
# Deploy on VPS:
#   cp deploy/nginx-uchetn1-ssl-mtu.conf /etc/nginx/sites-available/uchetn1-ssl-mtu.conf
#   ln -sfn ... /etc/nginx/sites-enabled/
#   # HAProxy backend must have: send-proxy-v2
#   nginx -t && systemctl reload nginx
#   haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy

map $http_upgrade $connection_upgrade {
    default upgrade;
    ~^$ close;
}

# Внешний IP клиента из PROXY protocol (HAProxy TCP → nginx)
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header proxy_protocol;

server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    server_name uchetn1.ru www.uchetn1.ru
                pick.uchetn1.ru www.pick.uchetn1.ru
                photo.uchetn1.ru www.photo.uchetn1.ru
                lift.uchetn1.ru www.lift.uchetn1.ru
                in.uchetn1.ru www.in.uchetn1.ru
                reception.uchetn1.ru www.reception.uchetn1.ru
                swagger.uchetn1.ru www.swagger.uchetn1.ru
                api.uchetn1.ru www.api.uchetn1.ru
                api-docs.uchetn1.ru www.api-docs.uchetn1.ru
                pdn.uchetn1.ru www.pdn.uchetn1.ru;

    ssl_certificate     /etc/letsencrypt/live/uchetn1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uchetn1.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_UCHET:10m;
    ssl_session_timeout 1d;
    ssl_buffer_size     4k;
    ssl_prefer_server_ciphers off;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    server_name 1c.pnevmopodveska1.ru www.1c.pnevmopodveska1.ru;

    ssl_certificate     /etc/letsencrypt/live/1c.pnevmopodveska1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1c.pnevmopodveska1.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_1C:10m;
    ssl_buffer_size     4k;
    ssl_prefer_server_ciphers off;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 300s;
    }
}
