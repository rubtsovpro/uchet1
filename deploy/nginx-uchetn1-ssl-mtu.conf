proxy_cache_path /var/cache/nginx/pick levels=1:2 keys_zone=pickcache:20m max_size=128m inactive=2m use_temp_path=off;
# TLS for uchetn1 / pick / 1c — small SSL records (MTU-safe)
# Used behind HAProxy SNI on :443 → 127.0.0.1:4443 (PROXY protocol v2)
#
# Deploy on VPS:
#   cp deploy/nginx-uchetn1-ssl-mtu.conf /etc/nginx/sites-available/uchetn1-ssl-mtu.conf
#   ln -sfn ... /etc/nginx/sites-enabled/
#   # HAProxy backend must have: send-proxy-v2
#   nginx -t && systemctl reload nginx
#   haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy
#
# Steady-state: rate-limit Amo webhooks (429), never stub with return 200 OK.
# Pick/production poll — без limit_req (параллельный опрос /pick ловил 503).
# See docs/WMS-STEADY-LIMITS.md

map $http_upgrade $connection_upgrade {
    default upgrade;
    ~^$ close;
}

# Внешний IP клиента из PROXY protocol (HAProxy TCP → nginx)
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header proxy_protocol;

# Шторм Amo → 429 (ретрай), не фейковый 200 без Node
limit_req_zone $binary_remote_addr zone=amo_webhook:2m rate=8r/s;

server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    server_name uchetn1.ru www.uchetn1.ru
                pick.uchetn1.ru www.pick.uchetn1.ru
                photo.uchetn1.ru www.photo.uchetn1.ru
                lift.uchetn1.ru www.lift.uchetn1.ru
                in.uchetn1.ru www.in.uchetn1.ru
                reception.uchetn1.ru www.reception.uchetn1.ru
                swagger.uchetn1.ru www.swagger.uchetn1.ru
                api.uchetn1.ru www.api.uchetn1.ru
                api-docs.uchetn1.ru www.api-docs.uchetn1.ru
                pdn.uchetn1.ru www.pdn.uchetn1.ru;

    ssl_certificate     /etc/letsencrypt/live/uchetn1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uchetn1.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_UCHET:10m;
    ssl_session_timeout 1d;
    ssl_buffer_size     1400;
    ssl_prefer_server_ciphers off;
    client_max_body_size 64m;

    location = /api/webhooks/amo {
        limit_req zone=amo_webhook burst=40 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 60s;
    }

    location ^~ /api/warehouse/pick/ {
        proxy_cache pickcache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$http_cookie$request_uri";
        proxy_cache_valid 200 4s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 8s;
        proxy_cache_use_stale updating error timeout;
        add_header X-Pick-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    location ^~ /api/production/jobs {
        proxy_cache pickcache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$http_cookie$request_uri";
        proxy_cache_valid 200 4s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 8s;
        proxy_cache_use_stale updating error timeout;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

