# Фрагмент для /etc/haproxy/haproxy.cfg
# HAProxy TCP (SNI) → nginx :4443 с PROXY protocol — иначе nginx видит только 127.0.0.1
#
# В backend be_uchetn1:
#   server nginx_ssl 127.0.0.1:4443 send-proxy-v2
#
# nginx: listen … proxy_protocol; set_real_ip_from 127.0.0.1; real_ip_header proxy_protocol;

backend be_uchetn1
    mode tcp
    server nginx_ssl 127.0.0.1:4443 send-proxy-v2
