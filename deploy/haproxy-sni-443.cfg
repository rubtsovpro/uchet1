# HAProxy SNI router: public :443 + :9443 (обход, если у оператора таймаут на 443)
# - *.uchetn1.ru + 1c.pnevmopodveska1.ru → nginx 127.0.0.1:4443 (ssl_buffer_size 4k, PROXY)
# - everything else → Apache 127.0.0.1:8443
#
# Apache ports.conf must have: Listen 127.0.0.1:8443 (not *:443)
# nginx: listen 127.0.0.1:4443 ssl http2 proxy_protocol;

global
    log /dev/log local0
    maxconn 8000
    user haproxy
    group haproxy
    daemon
    tune.bufsize 65536
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 5s
    timeout client  120s
    timeout server  120s
    timeout client-fin 5s
    timeout server-fin 5s
    timeout tunnel 1h
    maxconn 5000

frontend fe_https
    bind *:443
    bind *:9443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    tcp-request content accept if { req.ssl_hello_type 1 }

    use_backend be_uchetn1 if { req_ssl_sni -i uchetn1.ru }
    use_backend be_uchetn1 if { req_ssl_sni -i www.uchetn1.ru }
    use_backend be_uchetn1 if { req_ssl_sni -m end .uchetn1.ru }
    use_backend be_uchetn1 if { req_ssl_sni -i 1c.pnevmopodveska1.ru }
    use_backend be_uchetn1 if { req_ssl_sni -i www.1c.pnevmopodveska1.ru }
    use_backend be_uchetn1 if { req.ssl_sni -i uchetn1.ru }
    use_backend be_uchetn1 if { req.ssl_sni -i 1c.pnevmopodveska1.ru }
    default_backend be_apache_ssl

# MTU-safe TLS для мобильных сетей
backend be_uchetn1
    mode tcp
    server nginx_ssl 127.0.0.1:4443 send-proxy-v2 maxconn 500

backend be_apache_ssl
    mode tcp
    server apache_ssl 127.0.0.1:8443 maxconn 350
