# Fragment for 1c vhost — WMS at /, API swagger at /swagger
ProxyPreserveHost On
ProxyTimeout 300
ProxyRequests Off
ProxyAddHeaders On
# nginx (PROXY→реальный IP) → apache → node: сохраняем внешний адрес
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy ::1
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Ssl "on"

# PHP static: redirect /docs → WMS, swagger docs, assets
ProxyPass /docs !
ProxyPass /swagger !
ProxyPass /css !
ProxyPass /js !
ProxyPass /favicon.svg !
ProxyPassMatch ^/docs-openapi-deny\.htaccess$ !

# disablereuse: после рестарта WMS не бить keep-alive к мёртвому pid (AH01102 / 502)
ProxyPass /api http://127.0.0.1:3101/api disablereuse=On
ProxyPassReverse /api http://127.0.0.1:3101/api
ProxyPass /login http://127.0.0.1:3101/login disablereuse=On
ProxyPassReverse /login http://127.0.0.1:3101/login
ProxyPass /styles.css http://127.0.0.1:3101/styles.css disablereuse=On
ProxyPass /app.js http://127.0.0.1:3101/app.js disablereuse=On
ProxyPass / http://127.0.0.1:3101/ disablereuse=On
ProxyPassReverse / http://127.0.0.1:3101/
