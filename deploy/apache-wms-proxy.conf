# Fragment for 1c vhost — WMS at /, API swagger at /swagger
ProxyPreserveHost On
ProxyRequests Off

# PHP static: redirect /docs → WMS, swagger docs, assets
ProxyPass /docs !
ProxyPass /swagger !
ProxyPass /css !
ProxyPass /js !
ProxyPass /favicon.svg !
ProxyPassMatch ^/docs-openapi-deny\.htaccess$ !

ProxyPass /api http://127.0.0.1:3101/api
ProxyPassReverse /api http://127.0.0.1:3101/api
ProxyPass /login http://127.0.0.1:3101/login
ProxyPassReverse /login http://127.0.0.1:3101/login
ProxyPass /styles.css http://127.0.0.1:3101/styles.css
ProxyPass /app.js http://127.0.0.1:3101/app.js
ProxyPass / http://127.0.0.1:3101/
ProxyPassReverse / http://127.0.0.1:3101/
